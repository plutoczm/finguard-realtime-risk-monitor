name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall ai_service dashboard producer scripts
      - name: AI service tests
        run: python -m pytest -q tests/test_ai_service.py
      - name: Streaming support tests
        run: python -m pytest -q tests/test_event_schema.py tests/test_enterprise_dataset.py tests/test_dedup_logic.py tests/test_risk_rules.py
      - name: Golden-set evaluation
        run: python -m ai_service.eval --min-pass-rate 1.0
      - name: Static dashboard build
        run: python scripts/generate_vercel_data.py
      - name: Frontend syntax
        run: node --check dashboard/static/app.js && node --check dashboard/static/copilot.js
      - name: Compose config
        run: docker compose config >/dev/null

  flink-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -q -f flink-job/pom.xml test
